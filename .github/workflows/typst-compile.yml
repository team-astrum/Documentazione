name: Compila, pubblica i PDF e genera manifest

on:
  push:
    branches: [ "**" ]   # Qualsiasi branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout del repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup dell'ambiente Typst
      - uses: typst-community/setup-typst@v3

      # Esecuzione script Python per il glossario (solo branch main)
      - name: Genera il glossario
        if: github.ref == 'refs/heads/main'
        run: python3 .github/scripts/generate-glossario.py

      # Compilazione Typst e generazione del manifest.json
      - name: Compila i documenti e genera il manifest
        run: python3 .github/scripts/build-manifest.py

      # Configurazione GitHub Pages
      - name: Configura GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      # Prepara l'artefatto per il deploy su GitHub Pages
      - name: Carica artefatto Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # Crea l'archivio scaricabile con tutti i PDF
      - name: Salva artefatto PDF
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pdf-documents
          path: _site/

  deploy:
    needs: build
    # Il deploy parte solo da main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4