name: Compila PDF

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v3
      
      - name: Genera il glossario
        run: python3 .github/scripts/generate_glossary.py

      - name: Compila i documenti Typst
        run: |
          while IFS= read -r -d '' f; do
            out="_site/${f#./}"
            out="${out%.typ}.pdf"
            mkdir -p "$(dirname "$out")"
            echo "Compilo $f -> $out"
            typst compile --root . --font-path Template/Fonts --ignore-system-fonts "$f" "$out"
          done < <(find . -name '*.typ' -not -path './.*' -not -path './Template/*' -not -name '_*' -print0)

      # Sulle PR basta verificare che la compilazione riesca: nessun artefatto da pubblicare
      - name: Salva artefatto PDF
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pdf-documents
          path: _site/