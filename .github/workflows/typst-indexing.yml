name: Pubblica listing dinamico dei PDF

on:
  workflow_run:
    workflows: ["Compila PDF"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-site:
    # Solo se la compilazione è riuscita e non proviene da una pull request
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Stesso commit compilato dal primo workflow, con cronologia completa per le date
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Scarica i PDF compilati
        uses: actions/download-artifact@v4
        with:
          name: pdf-documents
          path: _site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Genera index.html
        run: |
          REPO_DIR="$PWD"
          cd _site

          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="it">
          <head><meta charset="utf-8"><title>Indice dei file</title></head>
          <body>
          <h1>Indice dei file</h1>
          EOF

          current_dir=""

          # Process substitution: il ciclo non gira in una subshell, quindi current_dir resta valido dopo
          while read -r f; do
            pdf_rel="${f#./}"
            dir_name=$(dirname "$pdf_rel")
            file_name=$(basename "$pdf_rel")

            if [ "$dir_name" != "$current_dir" ]; then
              if [ -n "$current_dir" ]; then
                echo '</ul>' >> index.html
              fi
              current_dir="$dir_name"

              if [ "$dir_name" = "." ]; then
                echo '<p style="margin: 1rem 0 0.2rem 0;">/</p>' >> index.html
              else
                echo "<p style=\"margin: 1rem 0 0.2rem 0;\">$dir_name/</p>" >> index.html
              fi
              echo '<ul style="list-style-type: none; padding-left: 1rem; margin: 0;">' >> index.html
            fi

            # Trova il file .typ corrispondente
            typ_rel="${pdf_rel%.pdf}.typ"
            typ_file=""
            if [ -f "$REPO_DIR/$typ_rel" ]; then
              typ_file="$REPO_DIR/$typ_rel"
            else
              typ_file=$(find "$REPO_DIR" -type f -name "${file_name%.pdf}.typ" -not -path '*/.*' | head -n 1)
            fi

            # Data dell'ultimo commit sul .typ (timestamp salvato nel tag: il grassetto lo decide il browser)
            date_tag=""
            if [ -n "$typ_file" ]; then
              last_commit=$(git -C "$REPO_DIR" log -1 --format="%ct" -- "$typ_file")
              last_date=$(git -C "$REPO_DIR" log -1 --date=format:'%d/%m/%Y' --format="%cd" -- "$typ_file")
              if [ -n "$last_commit" ]; then
                date_tag="<span data-ts=\"$last_commit\">$last_date</span>"
              fi
            fi

            if [ -n "$date_tag" ]; then
              echo "<li>$date_tag - <a href=\"$pdf_rel\">$file_name</a></li>" >> index.html
            else
              echo "<li><a href=\"$pdf_rel\">$file_name</a></li>" >> index.html
            fi
          done < <(find . -type f -name '*.pdf' | sort)

          if [ -n "$current_dir" ]; then
            echo '</ul>' >> index.html
          fi

          cat >> index.html <<'EOF'
          <script>
            // Grassetto per i documenti modificati negli ultimi 7 giorni, calcolato ad ogni visita
            const limit = Date.now() / 1000 - 7 * 86400;
            document.querySelectorAll('[data-ts]').forEach(function (el) {
              if (Number(el.dataset.ts) > limit) el.style.fontWeight = 'bold';
            });
          </script>
          </body>
          </html>
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4